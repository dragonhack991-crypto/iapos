name: iapos

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: iapos
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d iapos"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: iapos-app:latest
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/iapos?schema=public
      JWT_SECRET: ${JWT_SECRET}
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      # Preferred default: dynamic secure policy (x-forwarded-proto / URL protocol).
      # Use COOKIE_SECURE only as an explicit override for special deployments.
      # Example: set COOKIE_SECURE: "true" if your proxy terminates TLS but does
      # not pass X-Forwarded-Proto and you must force secure cookies.
      # COOKIE_SECURE: "false"
    ports:
      - "3000:3000"

volumes:
  postgres_data:
